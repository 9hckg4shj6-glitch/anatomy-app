<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620">
  <!-- 心臓の発生の模式図（このアプリで描いたもの）。左: 胎齢22日ごろのまっすぐな原始心筒を腹側から。右: 胎齢28日ごろ、ループしたあと。
       色: 動脈幹 赤・心球 橙・原始心室 桃・原始心房 青・静脈洞 紺。上が頭側。文字は平面図を作るとき除かれるので入れない -->
  <rect width="640" height="620" fill="#ffffff"/>
  <g stroke="#3a2a2a" stroke-width="3" stroke-linejoin="round">
    <!-- 左: まっすぐな心筒 -->
    <!-- 大動脈弓へ続く腕 -->
    <path d="M168 78 C150 50 120 40 92 46 L96 62 C118 58 140 66 154 86 Z" fill="#c0392b"/>
    <path d="M192 78 C210 50 240 40 268 46 L264 62 C242 58 220 66 206 86 Z" fill="#c0392b"/>
    <!-- 静脈洞の角へ入る静脈 -->
    <path d="M140 520 C120 548 100 568 78 584 L90 598 C114 582 136 560 156 530 Z" fill="#33508f"/>
    <path d="M220 520 C240 548 260 568 282 584 L270 598 C246 582 224 560 204 530 Z" fill="#33508f"/>
    <ellipse cx="180" cy="500" rx="66" ry="32" fill="#33508f"/>
    <ellipse cx="180" cy="420" rx="70" ry="50" fill="#7da2df"/>
    <ellipse cx="180" cy="312" rx="62" ry="64" fill="#d9677d"/>
    <ellipse cx="180" cy="200" rx="46" ry="50" fill="#ec9a6a"/>
    <rect x="160" y="74" width="40" height="96" rx="14" fill="#c0392b"/>
  </g>
  <g stroke="#3a2a2a" stroke-width="3" stroke-linejoin="round">
    <!-- 右: ループしたあと（腹側から。原始心房は心室の後ろ上へ回り、左右に心耳がのぞく） -->
    <ellipse cx="380" cy="190" rx="44" ry="34" fill="#7da2df"/>
    <ellipse cx="560" cy="190" rx="44" ry="34" fill="#7da2df"/>
    <path d="M462 88 C444 60 414 50 388 56 L392 72 C412 68 432 76 446 96 Z" fill="#c0392b"/>
    <path d="M478 88 C496 60 526 50 552 56 L548 72 C528 68 508 76 494 96 Z" fill="#c0392b"/>
    <!-- 原始心室（のちの左心室。図の右＝体の左） -->
    <path d="M470 250 C540 230 600 280 590 360 C580 430 520 470 470 440 C440 420 450 300 470 250 Z" fill="#d9677d"/>
    <!-- 心球（のちの右心室。図の左＝体の右） -->
    <path d="M470 250 C420 230 360 270 362 340 C364 410 420 450 470 440 C480 380 482 300 470 250 Z" fill="#ec9a6a"/>
    <path d="M452 92 L488 92 C496 130 492 170 484 210 C478 240 474 252 470 262 C466 252 456 220 452 200 C446 160 446 130 452 92 Z" fill="#c0392b"/>
  </g>
</svg>
