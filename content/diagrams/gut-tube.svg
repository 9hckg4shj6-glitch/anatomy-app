<svg xmlns="http://www.w3.org/2000/svg" width="600" height="640" viewBox="0 0 600 640">
  <!-- 消化管の発生の模式図（このアプリで描いたもの）。胎齢5週ごろの原始腸管を左から見た図（上が頭側、右が背側、左が腹側）。
       前腸（咽頭〜十二指腸の上半）・中腸（一次腸ループ、頂点に卵黄腸管と卵黄嚢）・後腸（〜総排泄腔）を黄で、
       背側腸間膜と腹側腸間膜を薄い桃、大動脈と3本の枝（腹腔動脈・上腸間膜動脈・下腸間膜動脈）を赤、肝臓を茶、
       横中隔を黄土色、一次腸ループの先が出ていく臍帯（生理的臍帯ヘルニア）を点線で示す -->
  <rect width="600" height="640" fill="#ffffff"/>
  <!-- 背側腸間膜（大動脈と腸管の間） -->
  <path d="M470 150 L470 560 L392 560 L392 420 C330 425 250 420 175 395 C160 390 150 375 152 355 C154 335 168 325 180 322 C250 300 330 300 392 300 L392 150 Z" fill="#f3c3cf" stroke="#b07a88" stroke-width="2"/>
  <!-- 腹側腸間膜（胃・十二指腸の上部と前の腹壁の間。中に肝臓） -->
  <path d="M372 175 L372 292 L118 292 L118 175 Z" fill="#f3c3cf" stroke="#b07a88" stroke-width="2"/>
  <!-- 横中隔（心膜腔と腹膜腔の間の中胚葉の板。肝臓がこの中へ育つ） -->
  <path d="M112 150 L384 150 L384 170 C330 168 250 172 200 182 C170 188 140 190 112 192 Z" fill="#dcc39a" stroke="#8a6a3a" stroke-width="2"/>
  <!-- 前の腹壁（腹側腸間膜が付く所） -->
  <rect x="100" y="160" width="18" height="150" rx="6" fill="#e8b48a" stroke="#8a5a3a" stroke-width="2"/>
  <!-- 肝臓 -->
  <path d="M190 200 C230 185 300 190 330 215 C350 235 340 270 300 280 C250 290 200 285 180 262 C165 240 168 210 190 200 Z" fill="#9c4a2c" stroke="#5a2a18" stroke-width="2.5"/>
  <!-- 大動脈 -->
  <rect x="462" y="40" width="22" height="540" rx="10" fill="#c0392b" stroke="#6e1a12" stroke-width="2"/>
  <!-- 腹腔動脈（胃へ）・上腸間膜動脈（中腸の軸）・下腸間膜動脈（後腸へ） -->
  <path d="M464 226 L398 226 L398 236 L464 236 Z" fill="#c0392b" stroke="#6e1a12" stroke-width="1.5"/>
  <path d="M464 352 C400 352 300 356 190 357 L190 367 C300 366 400 362 464 362 Z" fill="#c0392b" stroke="#6e1a12" stroke-width="1.5"/>
  <path d="M464 470 L398 470 L398 480 L464 480 Z" fill="#c0392b" stroke="#6e1a12" stroke-width="1.5"/>
  <!-- 原始腸管 -->
  <g fill="#e8c25a" stroke="#7a5a10" stroke-width="2.5" stroke-linejoin="round">
    <!-- 咽頭（広い）・食道 -->
    <path d="M360 40 L420 40 C424 70 418 100 404 112 L398 190 L376 190 L370 112 C356 100 352 70 360 40 Z"/>
    <!-- 胃（腹側へふくらむ） -->
    <path d="M376 186 L398 186 C404 200 404 250 398 268 C396 276 392 282 388 284 L382 284 C350 272 338 230 350 205 C356 194 366 188 376 186 Z"/>
    <!-- 十二指腸と中腸の頭側の脚 → 一次腸ループ → 尾側の脚 -->
    <path d="M380 282 L400 282 C401 296 396 304 386 308 C320 314 250 320 186 338 C168 344 166 378 186 384 C250 402 330 410 386 416 C396 420 400 428 400 440 L380 440 C380 432 378 430 372 429 C320 424 240 418 178 400 C140 390 140 330 178 320 C240 304 320 298 368 294 C376 293 380 290 380 282 Z"/>
    <!-- 後腸 -->
    <path d="M380 436 L400 436 L400 520 L380 520 Z"/>
    <!-- 総排泄腔 -->
    <path d="M370 516 L410 516 C424 530 424 566 404 576 L376 576 C356 566 356 530 370 516 Z"/>
    <!-- 卵黄腸管と卵黄嚢 -->
    <path d="M150 356 L150 366 L92 372 L92 362 Z"/>
    <circle cx="62" cy="367" r="34"/>
  </g>
  <!-- 臍帯（胎齢6〜10週は一次腸ループの先がこの中へ出る＝生理的臍帯ヘルニア） -->
  <path d="M232 316 C200 304 128 306 104 330 C88 346 88 388 104 404 C128 428 200 430 232 418" fill="none" stroke="#6b6b8a" stroke-width="2.5" stroke-dasharray="9 6"/>
</svg>
