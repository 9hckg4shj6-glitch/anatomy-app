<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600">
  <!-- 肝臓と膵臓の発生の模式図（このアプリで描いたもの）。
       左: 胎齢5週ごろ、十二指腸になる前腸を左から見た図（上が頭側、左が腹側、右が背側）。腹側へ肝憩室（肝臓は茶・胆嚢は緑）と腹側膵芽（黄）、
       背側へ背側膵芽（橙）が出る。右: 胎齢7週ごろ、腹側膵芽が十二指腸の後ろを回って背側膵芽と合わさったあとを前から見た図（図の左が体の右）。
       腹側膵芽からできた所（膵頭の下部・鈎状突起）を黄、背側膵芽からできた所を橙、膵管を茶の線、総胆管を緑の線で示す -->
  <rect width="640" height="600" fill="#ffffff"/>
  <!-- 仕切りの線 -->
  <line x1="300" y1="40" x2="300" y2="560" stroke="#c9c2b4" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- ===== 左: 胎齢5週 ===== -->
  <!-- 横中隔（肝臓が育つ中胚葉） -->
  <path d="M22 150 C40 120 110 112 150 128 L150 300 C110 316 40 306 22 280 Z" fill="#efe2c6" stroke="#b39a6a" stroke-width="2"/>
  <!-- 肝臓（肝索） -->
  <path d="M40 170 C70 140 128 142 142 172 C154 200 150 250 128 270 C100 292 52 282 38 252 C26 226 26 192 40 170 Z" fill="#9c4a2c" stroke="#5a2a18" stroke-width="2.5"/>
  <!-- 胃（前腸のふくらみ）・十二指腸（前腸の管） -->
  <path d="M196 40 L228 40 C252 60 262 110 248 150 C242 166 236 176 234 190 L234 520 L204 520 L204 190 C196 170 178 140 178 104 C178 76 186 54 196 40 Z" fill="#e8c25a" stroke="#7a5a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 肝憩室の根もと（総胆管になる）と胆嚢 -->
  <path d="M204 236 C186 234 168 226 150 214 L144 230 C162 244 184 252 204 254 Z" fill="#e8c25a" stroke="#7a5a10" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M156 252 C140 262 132 282 140 296 C150 310 172 304 178 288 C182 274 176 260 168 252 Z" fill="#8bbf6a" stroke="#3f6a26" stroke-width="2.5"/>
  <!-- 腹側膵芽（肝憩室のすぐ下から腹側へ） -->
  <path d="M204 276 C186 276 168 286 162 302 C156 320 170 334 188 330 C198 328 204 318 204 308 Z" fill="#f2d36b" stroke="#8a6a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 背側膵芽（背側へ。腹側膵芽より大きく少し上） -->
  <path d="M234 222 C256 214 284 222 290 246 C296 272 282 300 258 304 C246 306 238 300 234 292 Z" fill="#f0a24a" stroke="#8a4a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- ===== 右: 胎齢7週（前から） ===== -->
  <!-- 十二指腸（C字。図の左が体の右） -->
  <path d="M352 120 L420 120 L420 150 L386 150 C362 152 350 170 350 200 L350 400 C350 440 372 462 408 462 L560 462 L560 492 L404 492 C350 492 320 456 320 400 L320 200 C320 150 334 120 352 120 Z" fill="#e8c25a" stroke="#7a5a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 背側膵芽からできた所: 膵頭の上部・膵体・膵尾 -->
  <path d="M354 196 C370 168 414 160 452 166 C500 160 560 150 606 168 C626 178 626 204 606 214 C560 232 500 236 460 244 C440 250 420 276 404 300 C390 318 362 316 356 296 C350 270 346 222 354 196 Z" fill="#f0a24a" stroke="#8a4a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 腹側膵芽からできた所: 膵頭の下部・鈎状突起 -->
  <path d="M356 300 C362 320 392 322 406 300 C420 284 440 280 452 300 C466 326 458 372 432 398 C410 420 380 424 364 410 C350 396 350 340 356 300 Z" fill="#f2d36b" stroke="#8a6a10" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 総胆管（上から膵頭の後ろを下り、大十二指腸乳頭へ） -->
  <path d="M396 40 C394 120 392 220 384 300 C380 338 368 356 352 364" fill="none" stroke="#3f6a26" stroke-width="5" stroke-linecap="round"/>
  <!-- 主膵管（膵尾 → 膵体 → 膵頭の下部で総胆管と合わさる） -->
  <path d="M600 192 C540 200 480 204 440 222 C410 238 404 280 400 320 C398 344 380 360 354 366" fill="none" stroke="#6a3a18" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 副膵管（膵頭の上部から小十二指腸乳頭へ） -->
  <path d="M430 228 C404 238 380 250 352 262" fill="none" stroke="#6a3a18" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 4"/>
  <!-- 大十二指腸乳頭・小十二指腸乳頭 -->
  <circle cx="351" cy="364" r="6" fill="#6a3a18"/>
  <circle cx="351" cy="262" r="4.5" fill="#6a3a18"/>
</svg>
