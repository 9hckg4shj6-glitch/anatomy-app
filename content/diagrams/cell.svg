<svg xmlns="http://www.w3.org/2000/svg" width="800" height="640" viewBox="0 0 800 640">
  <!-- 動物細胞の模式図（このアプリで描いたもの）。細胞膜に包まれた細胞質の中に、核と細胞小器官。
       核（核膜・核膜孔・核小体・染色質）、粗面小胞体（リボソームが付く）、滑面小胞体、ゴルジ装置と小胞、リソソーム、ミトコンドリア、
       中心体、遊離リボソーム。文字は平面図を作るとき除かれるので入れない -->
  <rect width="800" height="640" fill="#ffffff"/>
  <!-- 細胞膜と細胞質 -->
  <path d="M400 40 C560 36 720 120 750 290 C780 460 650 600 420 606 C200 612 60 520 46 330 C34 160 210 44 400 40 Z" fill="#fbe7d8" stroke="#a0522d" stroke-width="7"/>
  <path d="M400 52 C552 48 706 128 736 290 C764 450 642 586 420 594 C210 600 72 512 58 330 C46 170 218 56 400 52 Z" fill="none" stroke="#e8b79a" stroke-width="3"/>
  <!-- 粗面小胞体（核を囲む平たい袋。表面にリボソーム） -->
  <g fill="#f3c9d6" stroke="#9c4a6a" stroke-width="3">
    <path d="M240 210 C260 150 330 116 400 118 L400 132 C338 132 280 162 262 214 Z"/>
    <path d="M214 220 C236 136 320 96 400 96 L400 108 C326 110 252 148 230 224 Z"/>
    <path d="M190 232 C210 128 310 74 404 74 L404 86 C316 88 222 138 206 236 Z"/>
  </g>
  <g fill="none" stroke="#5a2a4a" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 17">
    <path d="M234 206 C254 144 326 108 400 110"/>
    <path d="M268 220 C286 168 340 138 400 138"/>
    <path d="M208 218 C230 128 318 88 400 88"/>
    <path d="M184 228 C204 120 306 66 404 66"/>
  </g>
  <!-- 核（核膜は2重の膜で核膜孔が開く） -->
  <circle cx="360" cy="300" r="122" fill="#d9c6ee" stroke="#5b3f8c" stroke-width="5"/>
  <circle cx="360" cy="300" r="112" fill="none" stroke="#5b3f8c" stroke-width="3"/>
  <g fill="#ffffff">
    <rect x="352" y="174" width="16" height="16"/><rect x="474" y="292" width="16" height="16"/><rect x="230" y="292" width="16" height="16"/><rect x="352" y="410" width="16" height="16"/>
    <rect x="436" y="206" width="14" height="14" transform="rotate(45 443 213)"/><rect x="270" y="380" width="14" height="14" transform="rotate(45 277 387)"/>
  </g>
  <!-- 染色質（核の中の DNA） -->
  <g fill="none" stroke="#8a6cb8" stroke-width="4" stroke-linecap="round">
    <path d="M290 250 C310 236 322 262 340 252 C356 242 352 222 372 226"/>
    <path d="M410 238 C426 252 446 240 452 262 C458 282 436 290 446 310"/>
    <path d="M276 320 C292 340 270 356 290 372 C306 386 326 372 340 388"/>
    <path d="M410 360 C428 366 432 388 452 380"/>
    <path d="M300 290 C312 300 300 314 314 322"/>
  </g>
  <!-- 核小体 -->
  <circle cx="384" cy="312" r="34" fill="#5b3f8c"/>
  <!-- 滑面小胞体（リボソームの付かない管の網） -->
  <g fill="none" stroke="#6a8f3c" stroke-width="9" stroke-linecap="round">
    <path d="M130 360 C150 330 176 350 170 380 C164 410 196 420 214 400"/>
    <path d="M120 420 C140 400 166 428 152 452 C140 474 170 494 194 474"/>
    <path d="M170 380 C186 386 196 372 210 360"/>
  </g>
  <g fill="none" stroke="#cfe6b0" stroke-width="3" stroke-linecap="round">
    <path d="M130 360 C150 330 176 350 170 380 C164 410 196 420 214 400"/>
    <path d="M120 420 C140 400 166 428 152 452 C140 474 170 494 194 474"/>
    <path d="M170 380 C186 386 196 372 210 360"/>
  </g>
  <!-- ゴルジ装置（平たい袋の重なり）と分泌小胞 -->
  <g fill="#f6d57a" stroke="#a07a16" stroke-width="3">
    <path d="M540 240 C580 222 620 236 640 268 L630 276 C612 250 578 238 544 254 Z"/>
    <path d="M534 266 C576 246 622 262 646 298 L636 306 C614 274 576 260 540 280 Z"/>
    <path d="M530 292 C574 272 622 290 648 328 L638 336 C616 302 574 286 536 306 Z"/>
    <path d="M528 318 C572 300 618 320 644 356 L634 364 C612 332 572 314 534 332 Z"/>
    <circle cx="664" cy="262" r="10"/><circle cx="676" cy="300" r="8"/><circle cx="668" cy="346" r="10"/><circle cx="514" cy="250" r="7"/><circle cx="508" cy="292" r="7"/>
  </g>
  <!-- 膜から外へ出る小胞（開口分泌） -->
  <g fill="#f6d57a" stroke="#a07a16" stroke-width="3">
    <circle cx="708" cy="226" r="11"/>
  </g>
  <!-- リソソーム -->
  <g fill="#e07b5a" stroke="#8a3a20" stroke-width="3">
    <circle cx="560" cy="430" r="22"/>
    <circle cx="610" cy="470" r="15"/>
  </g>
  <g fill="#8a3a20">
    <circle cx="552" cy="424" r="3"/><circle cx="566" cy="436" r="3"/><circle cx="558" cy="440" r="2.6"/><circle cx="606" cy="468" r="2.6"/><circle cx="614" cy="474" r="2.6"/>
  </g>
  <!-- ミトコンドリア（2重膜とクリスタ） -->
  <g>
    <ellipse cx="260" cy="500" rx="68" ry="30" fill="#f0a35a" stroke="#8a4a10" stroke-width="4" transform="rotate(-12 260 500)"/>
    <path d="M206 506 L222 484 L238 514 L254 484 L270 514 L286 484 L302 508" fill="none" stroke="#8a4a10" stroke-width="3" stroke-linejoin="round" transform="rotate(-12 260 500)"/>
    <ellipse cx="470" cy="520" rx="56" ry="26" fill="#f0a35a" stroke="#8a4a10" stroke-width="4" transform="rotate(18 470 520)"/>
    <path d="M426 524 L440 506 L454 532 L468 506 L482 532 L496 506 L510 526" fill="none" stroke="#8a4a10" stroke-width="3" stroke-linejoin="round" transform="rotate(18 470 520)"/>
    <ellipse cx="620" cy="170" rx="46" ry="22" fill="#f0a35a" stroke="#8a4a10" stroke-width="4" transform="rotate(-28 620 170)"/>
    <path d="M584 174 L596 158 L608 180 L620 158 L632 180 L644 160 L654 172" fill="none" stroke="#8a4a10" stroke-width="3" stroke-linejoin="round" transform="rotate(-28 620 170)"/>
  </g>
  <!-- 中心体（直角に並ぶ2つの中心小体） -->
  <g fill="#7fb0c8" stroke="#2c5a70" stroke-width="3">
    <rect x="520" y="140" width="40" height="16" rx="4"/>
    <rect x="560" y="112" width="16" height="40" rx="4"/>
  </g>
  <!-- 遊離リボソーム -->
  <g fill="#5a2a4a">
    <circle cx="520" cy="380" r="3.6"/><circle cx="532" cy="388" r="3.6"/><circle cx="526" cy="398" r="3.6"/>
    <circle cx="660" cy="420" r="3.6"/><circle cx="672" cy="414" r="3.6"/><circle cx="668" cy="428" r="3.6"/>
    <circle cx="350" cy="560" r="3.6"/><circle cx="362" cy="566" r="3.6"/><circle cx="356" cy="552" r="3.6"/>
    <circle cx="140" cy="260" r="3.6"/><circle cx="150" cy="270" r="3.6"/><circle cx="132" cy="274" r="3.6"/>
  </g>
</svg>
