<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="解剖3D" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>解剖学 3D単語帳</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <!-- ホームでは名前、ほかのページでは「‹ ホーム」と今いるページ（src/main.ts の showCrumbs） -->
        <a class="brand" href="#/" aria-label="ホームへ">
          <svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1f6f78"/><g transform="rotate(-45 256 256)" fill="#fffdf8"><rect x="150" y="228" width="212" height="56" rx="18"/><circle cx="150" cy="220" r="42"/><circle cx="150" cy="292" r="42"/><circle cx="362" cy="220" r="42"/><circle cx="362" cy="292" r="42"/></g><circle cx="392" cy="120" r="34" fill="#ff7a1a"/></svg>

        <nav class="crumbs" id="crumbs" aria-label="今いる所"></nav>
        <a class="topbar-settings" href="#/settings" aria-label="設定" title="設定">⚙</a>
      </header>
      <main class="layout">
        <section class="stage" id="stage">
          <div class="stage-hint" id="stage-hint"></div>
          <div class="stage-tools" id="stage-tools"></div>
        </section>
        <section class="panel" id="panel"></section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
